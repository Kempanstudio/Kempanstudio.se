<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakta Lagerstål Städ</title>
  <style>
    :root { --ink: #1b2933; --muted: #64747d; --paper: #f3f8f7; --white: #fff; --teal: #168277; --dark: #123b40; --yellow: #f2c14e; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); font-family: Arial, sans-serif; background: var(--paper); line-height: 1.6; }
    header { padding: 24px 20px 70px; color: var(--white); text-align: center; background: linear-gradient(135deg, #123b40, #168277); }
    nav { display: flex; max-width: 1100px; margin: 0 auto 65px; align-items: center; justify-content: space-between; }
    nav a { color: var(--white); text-decoration: none; }
    .brand { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.3rem, 5vw, 4rem); }
    header p { color: #e1f3ef; }
    main { max-width: 720px; margin: -35px auto 0; padding: 0 20px 80px; }
    form { padding: 32px; border-radius: 6px; background: var(--white); box-shadow: 0 12px 28px rgba(18, 59, 64, .09); }
    label { display: block; margin: 18px 0 6px; font-weight: 700; }
    input, textarea { width: 100%; padding: 13px; border: 1px solid #cfe1de; border-radius: 4px; font: inherit; }
    textarea { min-height: 140px; resize: vertical; }
    button { margin-top: 24px; padding: 13px 24px; border: 0; border-radius: 4px; color: var(--ink); background: var(--yellow); font-weight: 700; font-size: 1rem; cursor: pointer; }
    button:hover { background: #ffd86d; }
    footer { padding: 24px; color: #d6e4e2; text-align: center; background: var(--dark); }
    footer p { margin: 0; }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Huvudmeny">
      <a class="brand" href="index.html">Lagerstål Städ</a>
      <a href="tjanster.html">Våra tjänster</a>
    </nav>
    <h1>Kontakta oss</h1>
    <p>Berätta vad du behöver hjälp med så återkommer vi så snart vi kan.</p>
  </header>

  <main>
    <form action="mailto:kontakt@lagerstalstad.se" method="post" enctype="text/plain">
      <label for="name">Namn</label>
      <input id="name" name="name" type="text" required>

      <label for="email">E-post</label>
      <input id="email" name="email" type="email" required>

      <label for="message">Vad behöver du hjälp med?</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Skicka förfrågan</button>
    </form>
  </main>

  <footer><p>&copy; 2026 Lagerstål Städ</p></footer>
</body>
</html>
