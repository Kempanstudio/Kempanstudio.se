<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakta Nordic Bygg</title>
  <style>
    :root { --ink: #17212b; --muted: #64727d; --paper: #f5f7f8; --white: #fff; --accent: #d8892f; --dark: #2d424d; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); font-family: Arial, sans-serif; background: var(--paper); line-height: 1.6; }
    header { padding: 24px 20px 70px; color: var(--white); text-align: center; background: linear-gradient(135deg, #17212b, var(--dark)); }
    nav { display: flex; max-width: 1100px; margin: 0 auto 65px; justify-content: space-between; align-items: center; }
    nav a { color: var(--white); text-decoration: none; }
    .brand { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.3rem, 5vw, 4rem); }
    header p { color: #d9e2e6; }
    main { max-width: 720px; margin: -35px auto 0; padding: 0 20px 80px; }
    form { padding: 32px; border-radius: 6px; background: var(--white); box-shadow: 0 12px 28px rgba(23, 33, 43, .09); }
    label { display: block; margin: 18px 0 6px; font-weight: 700; }
    input, textarea { width: 100%; padding: 13px; border: 1px solid #d5dde1; border-radius: 4px; font: inherit; }
    textarea { min-height: 140px; resize: vertical; }
    button { margin-top: 24px; padding: 13px 24px; border: 0; border-radius: 4px; color: var(--white); background: var(--accent); font-weight: 700; font-size: 1rem; cursor: pointer; }
    button:hover { background: #b96d1c; }
    footer { padding: 24px; color: #c7d0d5; text-align: center; background: #11191f; }
    footer p { margin: 0; }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Huvudmeny">
      <a class="brand" href="index.html">Nordic Bygg</a>
      <a href="tjanster.html">Våra tjänster</a>
    </nav>
    <h1>Kontakta oss</h1>
    <p>Berätta om ditt projekt så återkommer vi så snart vi kan.</p>
  </header>

  <main>
    <form action="mailto:kontakt@nordicbygg.se" method="post" enctype="text/plain">
      <label for="name">Namn</label>
      <input id="name" name="name" type="text" required>

      <label for="email">E-post</label>
      <input id="email" name="email" type="email" required>

      <label for="message">Meddelande</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Skicka förfrågan</button>
    </form>
  </main>

  <footer><p>&copy; 2026 Nordic Bygg</p></footer>
</body>
</html>
